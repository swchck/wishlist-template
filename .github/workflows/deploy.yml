name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # skip the template itself, and the push that creates a copy of it: Pages is not
    # enabled yet then; the copy's first deploy runs on its first real commit or by hand
    if: ${{ !github.event.repository.is_template && github.event.created != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with Astro
        uses: withastro/action@v6
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_YM_ID: ${{ vars.PUBLIC_YM_ID }}
          SITE: ${{ vars.SITE }}
          BASE_PATH: ${{ vars.BASE_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
